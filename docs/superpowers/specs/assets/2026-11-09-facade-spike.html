<!doctype html>
<html><head><meta charset="utf-8">
<!-- THROWAWAY SPIKE: a portico (3 bays) drawn with lines only, with mouldings, in four views. -->
<style>
html,body{margin:0;background:#fbfaf6}
#wrap{position:relative;width:1200px;height:800px;overflow:hidden}
#wrap canvas{position:absolute;left:0;top:0}
#title,#sub{background:#fbfaf6;padding:0 8px 2px 0}
#title{position:absolute;left:28px;top:18px;font:600 30px Georgia,serif;color:#222;z-index:3}
#sub{position:absolute;left:28px;top:58px;font:16px system-ui,sans-serif;color:#666;z-index:3}
</style></head>
<body><div id="wrap"><canvas id="ov" width="2400" height="1600" style="width:1200px;height:800px;z-index:2"></canvas><div id="title"></div><div id="sub"></div></div>
<script type="importmap">{"imports":{"three":"http://spike.local/three/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const W = 1200, H = 800, DPR = 2;
const wrap = document.getElementById("wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(DPR);
renderer.setSize(W, H);
renderer.localClippingEnabled = true;
renderer.setClearColor(0xfbfaf6);
wrap.prepend(renderer.domElement);
const scene = new THREE.Scene();

// ---------- materials: white paper (grey poché on cut faces), screen-space outline, crease lines ----------
const paperMat = new THREE.ShaderMaterial({
  uniforms: { uPaper: { value: new THREE.Color(0xfbfaf6) }, uPoche: { value: new THREE.Color(0x9b958a) } },
  vertexShader: `#include <clipping_planes_pars_vertex>
  void main(){ vec4 mvPosition = modelViewMatrix * vec4(position,1.0);
  #include <clipping_planes_vertex>
  gl_Position = projectionMatrix * mvPosition; }`,
  fragmentShader: `uniform vec3 uPaper; uniform vec3 uPoche;
  #include <clipping_planes_pars_fragment>
  void main(){
  #include <clipping_planes_fragment>
  gl_FragColor = vec4(gl_FrontFacing ? uPaper : uPoche, 1.0); }`,
  side: THREE.DoubleSide, clipping: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});
const hullMat = new THREE.ShaderMaterial({
  uniforms: { uWidth: { value: 1.3 * DPR }, uRes: { value: new THREE.Vector2(W * DPR, H * DPR) }, uColor: { value: new THREE.Color(0x2a2724) } },
  vertexShader: `uniform float uWidth; uniform vec2 uRes;
  #include <clipping_planes_pars_vertex>
  void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vec4 mvPosition = mv;
  #include <clipping_planes_vertex>
  vec3 vn = normalize(mat3(modelViewMatrix) * normal); vec4 clip = projectionMatrix * mv;
  vec2 dir = (projectionMatrix * vec4(vn,0.0)).xy; float len = length(dir);
  if (len > 1e-5) clip.xy += dir / len * uWidth * clip.w * 2.0 / uRes; gl_Position = clip; }`,
  fragmentShader: `uniform vec3 uColor;
  #include <clipping_planes_pars_fragment>
  void main(){
  #include <clipping_planes_fragment>
  gl_FragColor = vec4(uColor,1.0); }`,
  side: THREE.BackSide, clipping: true, polygonOffset: true, polygonOffsetFactor: 6, polygonOffsetUnits: 6,
});
const lineMat = new THREE.LineBasicMaterial({ color: 0x2a2724 });
const fineMat = new THREE.LineBasicMaterial({ color: 0x8a847a });
const mats = [paperMat, hullMat, lineMat, fineMat];

const group = new THREE.Group();
scene.add(group);
function add(geo, x = 0, y = 0, z = 0) {
  geo.translate(x, y, z);
  group.add(new THREE.Mesh(geo, paperMat), new THREE.Mesh(geo, hullMat), new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), lineMat));
}
function box(x0, x1, y0, y1, z0, z1) { add(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); }
/** A shape drawn in the façade plane (x, y), extruded from z0 to z1. */
function slab(shape, z0, z1, bevel = 0) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: z1 - z0 - 2 * bevel, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelOffset: -bevel, bevelSegments: 1, curveSegments: 40 });
  add(g, 0, 0, z0 + bevel);
}
/** A profile in (out = +z, y) run along x from x0 to x1 (mouldings, vault mass). */
function along(pts, x0, x1) {
  const s = new THREE.Shape(pts.map(([o, y]) => new THREE.Vector2(-o, y)));
  const g = new THREE.ExtrudeGeometry(s, { depth: x1 - x0, bevelEnabled: false, curveSegments: 40 });
  g.rotateY(Math.PI / 2);
  add(g, x0, 0, 0);
}
/** Moulding profile from y0: ["o", out] step, ["v", dh] fillet, ["ovolo"|"cavetto"|"cyma", dh, out] curve. */
function prof(y0, segs) {
  const pts = [[-0.05, y0], [0, y0]];
  let y = y0, o = 0;
  for (const s of segs) {
    if (s[0] === "o") { o = s[1]; pts.push([o, y]); }
    else if (s[0] === "v") { y += s[1]; pts.push([o, y]); }
    else {
      const [k, dh, o1] = s, o0 = o;
      for (let i = 1; i <= 10; i++) {
        const t = i / 10;
        const f = k === "ovolo" ? Math.sin((t * Math.PI) / 2) : k === "cavetto" ? 1 - Math.cos((t * Math.PI) / 2) : (1 - Math.cos(t * Math.PI)) / 2;
        pts.push([o0 + (o1 - o0) * f, y + dh * t]);
      }
      y += dh; o = o1;
    }
  }
  pts.push([-0.05, y]);
  return { pts, top: y };
}

// ---------- the portico: 3 bays, rusticated arcade, string course, windows with pediments, cornice, balustrade ----------
const BAY = 4.5, PIL = 1.0, N = 3, WIDTH = N * BAY + PIL, SPAN = BAY - PIL, R = SPAN / 2, SPRING = 4.0;
const cxs = [...Array(N)].map((_, i) => PIL + R + i * BAY);
const pils = [...Array(N + 1)].map((_, i) => i * BAY);
const STRING = 6.3, TOP = 10.8, DEPTH = 5.5, WIN = { w: 1.3, y0: 7.45, y1: 9.6 };

function archPath(p, cx, yBottom, r, spring) {
  p.moveTo(cx - r, yBottom); p.lineTo(cx + r, yBottom); p.lineTo(cx + r, spring);
  p.absarc(cx, spring, r, 0, Math.PI, false); p.lineTo(cx - r, yBottom);
}
function rectPath(p, x0, y0, x1, y1) { p.moveTo(x0, y0); p.lineTo(x1, y0); p.lineTo(x1, y1); p.lineTo(x0, y1); p.lineTo(x0, y0); }

// façade wall with arches and windows
{
  const s = new THREE.Shape(); rectPath(s, 0, 0, WIDTH, TOP);
  for (const cx of cxs) {
    const a = new THREE.Path(); archPath(a, cx, 0, R, SPRING); s.holes.push(a);
    const w = new THREE.Path(); rectPath(w, cx - WIN.w / 2, WIN.y0, cx + WIN.w / 2, WIN.y1); s.holes.push(w);
  }
  slab(s, -0.7, 0);
}
// back wall (courtyard side) with arched doors and windows
{
  const s = new THREE.Shape(); rectPath(s, 0, 0, WIDTH, TOP);
  for (const cx of cxs) {
    const d = new THREE.Path(); archPath(d, cx, 0.15, 0.8, 2.6); s.holes.push(d);
    const w = new THREE.Path(); rectPath(w, cx - WIN.w / 2, WIN.y0, cx + WIN.w / 2, WIN.y1); s.holes.push(w);
  }
  slab(s, -DEPTH - 0.6, -DEPTH);
}
// step and portico floor, with paving joints
box(0, WIDTH, 0, 0.15, -DEPTH, 0.35);
{
  const v = [];
  for (let x = 0.75; x < WIDTH; x += 0.75) v.push(x, 0.152, -DEPTH, x, 0.152, 0);
  for (let z = -0.75; z > -DEPTH; z -= 0.75) v.push(0, 0.152, z, WIDTH, 0.152, z);
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
  group.add(new THREE.LineSegments(g, fineMat));
}
// segmental barrel vault along the portico, with the upper floor above it (one solid mass)
{
  const zf = -0.7, zb = -DEPTH, zc = (zf + zb) / 2, hz = (zf - zb) / 2;
  const pts = [[zf, SPRING], [zf, STRING + 0.3], [zb, STRING + 0.3], [zb, SPRING]];
  for (let i = 1; i < 40; i++) { const a = (i / 40) * Math.PI; pts.push([zc - hz * Math.cos(a), SPRING + 1.6 * Math.sin(a)]); }
  along(pts, 0, WIDTH);
}
// roof slab
box(0, WIDTH, TOP, TOP + 0.2, -DEPTH - 0.6, -0.7);
// rusticated pilasters (bevelled blocks), imposts
for (const x0 of pils) {
  const courses = 8, h = (SPRING - 0.22 - 0.15) / courses;
  for (let i = 0; i < courses; i++) {
    const s = new THREE.Shape(); rectPath(s, x0 + 0.01, 0.15 + i * h + 0.02, x0 + PIL - 0.01, 0.15 + (i + 1) * h - 0.02);
    slab(s, 0, 0.12, 0.035);
  }
  const imp = prof(SPRING - 0.22, [["o", 0.04], ["v", 0.06], ["ovolo", 0.1, 0.14], ["v", 0.06]]);
  along(imp.pts, x0 - 0.06, x0 + PIL + 0.06);
}
// archivolts: voussoirs with a keystone
for (const cx of cxs) {
  const n = 11, r1 = R, gap = 0.01;
  for (let i = 0; i < n; i++) {
    const key = i === (n - 1) / 2, r2 = key ? R + 0.85 : R + 0.5;
    const a0 = (i / n) * Math.PI + gap, a1 = ((i + 1) / n) * Math.PI - gap;
    const s = new THREE.Shape();
    s.moveTo(cx + r1 * Math.cos(a0), SPRING + r1 * Math.sin(a0));
    s.absarc(cx, SPRING, r1, a0, a1, false);
    s.lineTo(cx + r2 * Math.cos(a1), SPRING + r2 * Math.sin(a1));
    s.absarc(cx, SPRING, r2, a1, a0, true);
    s.lineTo(cx + r1 * Math.cos(a0), SPRING + r1 * Math.sin(a0));
    slab(s, 0, key ? 0.2 : 0.1);
  }
}
// string course
const sc = prof(STRING, [["o", 0.05], ["v", 0.08], ["ovolo", 0.1, 0.16], ["o", 0.2], ["v", 0.16], ["cyma", 0.08, 0.27], ["v", 0.03]]);
along(sc.pts, -0.1, WIDTH + 0.1);
// upper floor: lesene, windows with frames, sills on corbels, pediments
for (const x0 of pils) box(x0 + 0.12, x0 + PIL - 0.12, sc.top, TOP, 0, 0.06);
for (const cx of cxs) {
  const x0 = cx - WIN.w / 2, x1 = cx + WIN.w / 2, f = 0.18;
  const fr = new THREE.Shape(); rectPath(fr, x0 - f, WIN.y0, x1 + f, WIN.y1 + f);
  const hole = new THREE.Path(); rectPath(hole, x0, WIN.y0, x1, WIN.y1); fr.holes.push(hole);
  slab(fr, 0, 0.08);
  const fin = new THREE.Shape(); rectPath(fin, x0 - f + 0.06, WIN.y0, x1 + f - 0.06, WIN.y1 + f - 0.06);
  const hole2 = new THREE.Path(); rectPath(hole2, x0, WIN.y0, x1, WIN.y1); fin.holes.push(hole2);
  slab(fin, 0.08, 0.11);
  box(cx - 0.95, cx + 0.95, WIN.y0 - 0.12, WIN.y0, 0, 0.2);
  for (const sx of [-0.7, 0.7]) box(cx + sx - 0.07, cx + sx + 0.07, WIN.y0 - 0.42, WIN.y0 - 0.12, 0, 0.15);
  const pb = WIN.y1 + f;
  box(cx - 1.05, cx + 1.05, pb, pb + 0.12, 0, 0.17);
  const tym = new THREE.Shape(); tym.moveTo(cx - 0.92, pb + 0.12); tym.lineTo(cx + 0.92, pb + 0.12); tym.lineTo(cx, pb + 0.5); tym.lineTo(cx - 0.92, pb + 0.12);
  slab(tym, 0, 0.06);
  for (const sgn of [-1, 1]) {
    const r = new THREE.Shape();
    r.moveTo(cx + sgn * 1.08, pb + 0.1); r.lineTo(cx, pb + 0.56); r.lineTo(cx, pb + 0.68); r.lineTo(cx + sgn * 1.08, pb + 0.22); r.lineTo(cx + sgn * 1.08, pb + 0.1);
    slab(r, 0, 0.17);
  }
}
// main cornice with dentils
const mc = prof(TOP, [["o", 0.08], ["v", 0.22], ["ovolo", 0.14, 0.24], ["v", 0.2], ["o", 0.46], ["v", 0.3], ["cyma", 0.22, 0.72], ["v", 0.05]]);
along(mc.pts, -0.25, WIDTH + 0.25);
{
  const y0 = TOP + 0.22 + 0.14, y1 = y0 + 0.2;
  for (let x = -0.15; x < WIDTH + 0.15; x += 0.3) box(x, x + 0.15, y0, y1, 0.24, 0.42);
}
// attic balustrade: plinth, pedestals over the pilasters, turned balusters, handrail
const BT = mc.top;
box(-0.1, WIDTH + 0.1, BT, BT + 0.2, -0.5, 0.05);
{
  const p2 = [[0, 0], [0.085, 0], [0.085, 0.05], [0.06, 0.08], [0.05, 0.12], [0.095, 0.22], [0.105, 0.3], [0.07, 0.42], [0.045, 0.48], [0.06, 0.52], [0.08, 0.55], [0.08, 0.6], [0, 0.6]];
  for (let i = 0; i < N; i++) {
    const a = pils[i] + PIL - 0.1, b = pils[i + 1] + 0.1;
    const n = Math.floor((b - a) / 0.3), step = (b - a) / n;
    for (let k = 0; k < n; k++) add(new THREE.LatheGeometry(p2.map(([r, y]) => new THREE.Vector2(r, y)), 28), a + step * (k + 0.5), BT + 0.2, -0.22);
  }
}
for (const x0 of pils) {
  box(x0 + 0.1, x0 + PIL - 0.1, BT + 0.2, BT + 0.8, -0.45, 0.0);
  box(x0 + 0.05, x0 + PIL - 0.05, BT + 0.8, BT + 0.95, -0.5, 0.05);
}
box(0, WIDTH, BT + 0.8, BT + 0.93, -0.4, -0.04);

// ---------- views ----------
const C = new THREE.Vector3(WIDTH / 2, 6.2, -2.5);
const ortho = (halfH) => new THREE.OrthographicCamera((-halfH * W) / H, (halfH * W) / H, halfH, -halfH, 0.1, 400);
const ov = document.getElementById("ov").getContext("2d");
ov.scale(DPR, DPR);
const section = new THREE.Plane(new THREE.Vector3(-1, 0, 0), cxs[1]);
const TEXT = {
  prospetto: ["Prospetto", "La facciata vista di fronte, come sulla tavola"],
  assonometria: ["Assonometria", "Lo stesso portico in 3D: le misure restano vere"],
  prospettiva: ["Prospettiva centrale", "Dall'altezza degli occhi (1,60 m): le linee di profondità vanno al punto di fuga"],
  sezione: ["Sezione A-A", "Il portico tagliato a metà campata: in grigio le parti sezionate"],
};
window.render = (view) => {
  let cam;
  ov.clearRect(0, 0, W, H);
  const planes = view === "sezione" ? [section] : null;
  for (const m of mats) { m.clippingPlanes = planes; m.needsUpdate = true; }
  if (view === "prospetto") { cam = ortho(8.2); cam.position.set(C.x, 6.6, 60); cam.lookAt(C.x, 6.6, 0); }
  else if (view === "assonometria") { cam = ortho(9.5); cam.position.copy(C).add(new THREE.Vector3(-0.85, 0.75, 1.25).normalize().multiplyScalar(80)); cam.lookAt(C); }
  else if (view === "sezione") { cam = ortho(8.0); cam.position.set(80, 6.6, -2.8); cam.lookAt(0, 6.6, -2.8); }
  else {
    cam = new THREE.PerspectiveCamera(66, W / H, 0.1, 400);
    cam.position.set(cxs[1], 1.6, 10.5); cam.lookAt(cxs[1], 1.6, -100);
    cam.setViewOffset(W, H, 0, -H * 0.24, W, H);
  }
  cam.updateProjectionMatrix();
  scene.updateMatrixWorld(true);
  renderer.render(scene, cam);
  ov.lineWidth = 1.4;
  if (view === "prospettiva") {
    const P = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(cam); return [((v.x + 1) / 2) * W, ((1 - v.y) / 2) * H]; };
    const vp = P(cxs[1], 1.6, -1e5);
    ov.strokeStyle = "#c0392b"; ov.fillStyle = "#c0392b"; ov.lineWidth = 1.2;
    ov.setLineDash([7, 6]);
    const from = [];
    from.push([0, 0.15, 0.35], [WIDTH, 0.15, 0.35], [-0.1, STRING, 0.3], [WIDTH + 0.1, STRING, 0.3]);
    for (const [x, y, z] of from) { const [a, b] = P(x, y, z); ov.beginPath(); ov.moveTo(a, b); ov.lineTo(vp[0], vp[1]); ov.stroke(); }
    ov.setLineDash([]); ov.lineWidth = 1.6;
    ov.beginPath(); ov.moveTo(0, vp[1]); ov.lineTo(W, vp[1]); ov.stroke();
    ov.beginPath(); ov.arc(vp[0], vp[1], 6, 0, Math.PI * 2); ov.fill();
    ov.font = "italic 17px Georgia, serif";
    ov.fillText("punto di fuga", vp[0] + 12, vp[1] - 10);
    ov.fillText("linea d'orizzonte", 24, vp[1] - 10);
  }
  if (view === "prospetto") {
    const v = new THREE.Vector3(cxs[1], 0, 0).project(cam), x = ((v.x + 1) / 2) * W;
    ov.strokeStyle = "#c0392b"; ov.fillStyle = "#c0392b"; ov.setLineDash([14, 5, 3, 5]);
    ov.beginPath(); ov.moveTo(x, 96); ov.lineTo(x, H - 20); ov.stroke(); ov.setLineDash([]);
    ov.font = "600 18px Georgia, serif"; ov.fillText("A", x + 8, 112); ov.fillText("A", x + 8, H - 26);
  }
  document.getElementById("title").textContent = TEXT[view][0];
  document.getElementById("sub").textContent = TEXT[view][1];
  return true;
};
window.ready = true;
</script></body></html>
