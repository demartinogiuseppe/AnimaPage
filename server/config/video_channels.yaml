commons:
  # Licence allow-list: LicenseShortName must start with one of these (case-insensitive).
  # Commons only hosts free licences; NC/ND are not accepted there anyway.
  licenses:
    - "CC0"
    - "Public domain"
    - "PD"
    - "CC BY"
    - "CC BY-SA"
  # Categories/publishers that make a file more likely educational (score bonus only).
  preferred_categories:
    - "NASA"
    - "ESA"
    - "National Archives"
    - "Educational"
    - "Documentary"
    - "Animations"
    - "Science"
    - "Nature"
    - "Volcano"
    - "Geography"
    - "History"
    - "Anatomy"
    - "Media of the day"
    - "Quality videos"
    - "Featured videos"

# Any match in title, description or categories excludes the video (word start, up to 3
# extra letters: "kill" also blocks "killing"). Lowercase, accents ignored.
blocked_terms:
  - sex
  - sexual
  - sexy
  - nude
  - nudity
  - naked
  - porn
  - pornography
  - erotic
  - nsfw
  - fetish
